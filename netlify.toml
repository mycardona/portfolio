# Netlify only hosts the CMS admin page and the GitHub OAuth flow; the public
# site is built and served by GitHub Pages (.github/workflows/deploy.yml).
# So publish just src/admin, and skip builds unless it (or this file) changed.
[build]
  command = "rm -rf netlify-dist && mkdir -p netlify-dist && cp -R src/admin netlify-dist/admin"
  publish = "netlify-dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/admin netlify.toml"

[build.environment]
  NODE_VERSION = "24"

# Anything other than /admin/ goes to the real site.
[[redirects]]
  from = "/*"
  to = "https://mycardona.github.io/portfolio/:splat"
  status = 302
