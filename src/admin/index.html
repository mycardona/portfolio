<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin</title>
  </head>
  <body>
    <!--
      Load CMS scripts from a pinned CDN rather than shipping the
      5 MB decap-cms.js from this site. Versions and SRI hashes must match package.json and the
      files in ./vendor/, which remain as a fallback if the CDN is unreachable.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/decap-cms@3.10.1/dist/decap-cms.js"
      integrity="sha384-cfeDbz01Pc3d/tDdxwcLyYE9bmTuSm9oSEkaqblVTYBG0eQ3a6koW/K3wUGSd/lG"
      crossorigin="anonymous"
    ></script>
    <script>
      window.CMS || document.write('<script src="./vendor/decap-cms.js"><\/script>');
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/decap-cms-widget-bulk-github-images@0.1.0/dist/index.js"
      integrity="sha384-6NszV3p8WrL/qDmkEi42ubRRavXcR00nB5C6TZg7mr0hQ3bdmRadSSgyxWEa4GMX"
      crossorigin="anonymous"
    ></script>
    <script>
      (window.CMS && window.CMS.getWidget("bulkGithubImages")) ||
        document.write('<script src="./vendor/decap-cms-widget-bulk-github-images.js"><\/script>');
    </script>
  </body>
</html>
