<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin</title>
  </head>
  <body>
    <script>
      (async function () {
        var host = window.location.hostname;
        if (!host.endsWith("github.io")) return;

        try {
          var response = await fetch("./config.yml", { cache: "no-store" });
          if (!response.ok) return;

          var configText = await response.text();
          var siteDomainMatch = configText.match(/^\s*site_domain:\s*([^\s#]+)/m);
          var siteUrlMatch = configText.match(/^\s*site_url:\s*([^\s#]+)/m);
          if (!siteDomainMatch || !siteUrlMatch) return;

          var expectedHost = new URL(siteUrlMatch[1]).hostname;
          if (host !== expectedHost) return;

          var siteDomain = siteDomainMatch[1]
            .trim()
            .replace(/^https?:\/\//i, "")
            .replace(/\/.*$/, "")
            .toLowerCase();

          if (!siteDomain) return;
          var allowedNetlifyDomains = [siteDomain];
          var isNetlifyAppDomain = /^[a-z0-9-]+\.netlify\.app$/.test(siteDomain);
          if (!isNetlifyAppDomain) return;
          if (!allowedNetlifyDomains.includes(siteDomain)) return;

          var netlifyAdminUrl = "https://" + siteDomain + "/admin/";
          window.location.replace(netlifyAdminUrl);
        } catch (error) {
          // If config cannot be read, continue loading local CMS.
        }
      })();
    </script>
    <!--
      Load CMS scripts from a pinned CDN so the Netlify site only serves this page,
      config.yml, and OAuth. Netlify was truncating the 5 MB decap-cms.js, leaving
      the admin blank. Versions and SRI hashes must match package.json and the
      files in ./vendor/, which remain as a fallback if the CDN is unreachable.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/decap-cms@3.10.1/dist/decap-cms.js"
      integrity="sha384-cfeDbz01Pc3d/tDdxwcLyYE9bmTuSm9oSEkaqblVTYBG0eQ3a6koW/K3wUGSd/lG"
      crossorigin="anonymous"
    ></script>
    <script>
      window.CMS || document.write('<script src="./vendor/decap-cms.js"><\/script>');
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/decap-cms-widget-bulk-github-images@0.1.0/dist/index.js"
      integrity="sha384-6NszV3p8WrL/qDmkEi42ubRRavXcR00nB5C6TZg7mr0hQ3bdmRadSSgyxWEa4GMX"
      crossorigin="anonymous"
    ></script>
    <script>
      (window.CMS && window.CMS.getWidget("bulkGithubImages")) ||
        document.write('<script src="./vendor/decap-cms-widget-bulk-github-images.js"><\/script>');
    </script>
  </body>
</html>
