backend:
  name: github
  repo: mycardona/portfolio
  branch: main
  # Netlify site used only for OAuth provider tokens
  site_domain: scintillating-pegasus-27bdcb.netlify.app
  # Limit OAuth scope for public-repo editing
  auth_scope: public_repo

# Allows local CMS editing via `npm run dev:cms`
local_backend: true

# Set this to your live public site URL (GitHub Pages in this setup)
site_url: https://mycardona.github.io/portfolio/
media_folder: src/uploads
public_folder: /uploads

collections:
  - name: categories
    label: Categories
    label_singular: Category
    folder: src/content/categories
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    identifier_field: title
    fields:
      - {
          label: Category Title,
          name: title,
          widget: string,
          hint: "Display name shown across the site."
        }
      - {
          label: Slug,
          name: slug,
          widget: string,
          hint: "Lowercase URL key, e.g. 'performance'."
        }
      - {
          label: Description,
          name: description,
          widget: text,
          required: false,
          hint: "Short category intro shown on category pages."
        }
      - {
          label: Order,
          name: order,
          widget: number,
          value_type: int,
          required: false,
          min: 1,
          hint: "Optional sort order for category lists. Lower numbers appear first."
        }
      - { label: Permalink, name: permalink, widget: hidden, default: false }
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Date
        name: date
        widget: datetime
        time_format: false
        date_format: "MMMM YYYY"
        format: "YYYY-MM"
        picker_utc: true
        hint: "Month and year only."
      - label: Categories
        name: categories
        widget: relation
        collection: categories
        search_fields: ["title"]
        value_field: slug
        display_fields: ["title"]
        required: false
        multiple: true
        hint: "Select from existing categories in the Categories collection."
      - { label: Summary, name: summary, widget: text, required: false }
      - {
          label: Venue,
          name: venueName,
          widget: string,
          required: false,
          hint: "Venue name, e.g. New Conservatory Theater Company."
        }
      - {
          label: Venue URL,
          name: venueUrl,
          widget: string,
          required: false,
          hint: "Optional link to the venue website."
        }
      - { label: Cover Image, name: coverImage, widget: image, required: false }
      - label: Gallery Images
        name: gallery
        widget: bulkGithubImages
        required: false
        repo: mycardona/portfolio
        branch: main
        proxy_url: http://localhost:8081/api/v1
        media_folder: src/uploads
        public_folder: /uploads
      - label: Video or Audio URL
        name: mediaUrl
        widget: string
        required: false
        hint: "Use https://... for an external media URL or /uploads/... for a direct uploaded media file."
        pattern:
          - "^(https?:\\/\\/\\S+|\\/\\S+)$"
          - "Use a full https:// URL or a site-relative file path like /uploads/reel.mp4"
      - { label: Body, name: body, widget: markdown }
  - name: videos
    label: Videos
    label_singular: Video
    folder: src/content/videos
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Reel Tag,
          name: reelTag,
          widget: string,
          hint: "Used for the homepage reel tab label, for example Dramatic or Comedic."
        }
      - label: Video URL
        name: mediaUrl
        widget: string
        hint: "Use https://... for an external media URL or /uploads/... for a direct uploaded media file."
        pattern:
          - "^(https?:\\/\\/\\S+|\\/\\S+)$"
          - "Use a full https:// URL or a site-relative file path like /uploads/reel.mp4"
  - name: pressQuotes
    label: Press + Testimonials
    label_singular: Quote
    folder: src/content/press
    create: true
    slug: "{{slug}}"
    summary: "{{source}}"
    fields:
      - {
          label: Order,
          name: order,
          widget: number,
          value_type: int,
          required: false,
          min: 1,
          hint: "Optional sort order. Lower numbers appear first."
        }
      - {
          label: Quote,
          name: quote,
          widget: text,
          hint: "The testimonial or press quote shown on the homepage."
        }
      - {
          label: Source,
          name: source,
          widget: string,
          required: false,
          hint: "Who or where the quote is from."
        }
      - {
          label: Source Link,
          name: sourceUrl,
          widget: string,
          required: false,
          hint: "Optional URL to the article or source."
        }
  - name: homepage
    label: Homepage
    files:
      - label: Hero
        name: landing
        file: src/_data/homepage/hero.json
        fields:
          - { label: Kicker, name: kicker, widget: string, required: false, hint: "Short label above the homepage hero name." }
          - { label: First Name, name: firstName, widget: string, required: false, hint: "First line of the hero headline." }
          - { label: Last Name, name: lastName, widget: string, required: false, hint: "Second line of the hero headline." }
          - { label: Role Line, name: role, widget: string, required: false, hint: "Tagline shown under the hero name." }
          - { label: Positioning Copy, name: positioning, widget: text, required: false, hint: "Supporting copy beneath the hero headline." }
          - { label: Primary Button Label, name: primaryCtaLabel, widget: string, required: false, hint: "Text for the button that jumps to the Reel section." }
          - { label: Secondary Button Label, name: secondaryCtaLabel, widget: string, required: false, hint: "Text for the button that links to the Book page." }
      - label: Selected Work
        name: selected-work
        file: src/_data/homepage/selectedWork.json
        fields:
          - { label: Section Label, name: eyebrow, widget: string, required: false, hint: "Homepage heading for this section. The cards below pull from the Categories collection." }
          - { label: Summary, name: summary, widget: text, required: false, hint: "Intro sentence shown above the Selected Work cards." }
          - { label: Default Card Copy, name: defaultCardCopy, widget: text, required: false, hint: "Fallback text used when a category does not have its own description." }
          - { label: Empty Card Status, name: emptyCardStatus, widget: string, required: false, hint: "Fallback status shown when a category has no associated projects yet." }
      - label: Reel
        name: reel
        file: src/_data/homepage/reel.json
        fields:
          - { label: Section Label, name: eyebrow, widget: string, required: false, hint: "Homepage heading for this section. The tabs and videos pull from the Videos collection." }
          - { label: Summary, name: summary, widget: text, required: false, hint: "Intro sentence shown above the reel player." }
          - { label: Empty Message, name: emptyMessage, widget: text, required: false, hint: "Shown only when no videos exist in the Videos collection." }
      - label: Press
        name: press
        file: src/_data/homepage/press.json
        fields:
          - { label: Section Label, name: eyebrow, widget: string, required: false, hint: "Homepage heading for this section. The quotes shown here pull from the Press + Testimonials collection." }
          - { label: Empty Message, name: emptyMessage, widget: text, required: false, hint: "Shown only when no quotes exist in the Press + Testimonials collection." }
      - label: Current + Upcoming
        name: upcoming
        file: src/_data/homepage/upcoming.json
        fields:
          - { label: Section Label, name: eyebrow, widget: string, required: false, hint: "Homepage heading for this section. The project cards shown here pull from the Projects collection." }
          - { label: Booking Link Label, name: bookingLinkLabel, widget: string, required: false, hint: "Text for the link that points to the Book page." }
  - name: about
    label: About
    files:
      - label: Hero
        name: hero
        file: src/_data/about/hero.json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Lead, name: lead, widget: text, required: false }
          - {
              label: Headshot,
              name: headshot,
              widget: image,
              required: false,
              hint: "Portrait photo shown to the right of the About sections. A vertical (4:5) crop works best."
            }
          - {
              label: Headshot Alt Text,
              name: headshotAlt,
              widget: string,
              required: false,
              hint: "Describe the photo for screen readers, e.g. 'Mylo Cardona smiling in a red jacket'."
            }
      - label: Detail
        name: detail
        file: src/_data/about/detail.json
        fields:
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field:
                  label: Paragraph
                  name: paragraph
                  widget: text
      - label: Resume
        name: resume
        file: src/_data/about/resume.json
        fields:
          - label: Display
            name: display
            widget: select
            default: structured
            options:
              - { label: "Built-in resume (edit the sections below)", value: structured }
              - { label: "Uploaded PDF", value: pdf }
            hint: "Choose what the About page shows. If 'Uploaded PDF' is chosen but no PDF is uploaded, the built-in resume is shown instead."
          - {
              label: PDF Resume,
              name: pdf,
              widget: file,
              required: false,
              hint: "Used only when Display is 'Uploaded PDF'. Upload a .pdf file; it is shown inline on the About page."
            }
          - {
              label: PDF Link Label,
              name: pdfLabel,
              widget: string,
              required: false,
              default: "Download PDF resume",
              hint: "Used only when Display is 'Uploaded PDF'. Text for the open/download link under the PDF."
            }
          - { label: Eyebrow, name: eyebrow, widget: string, required: false, hint: "Small label above the resume heading (both modes)." }
          - { label: Title, name: title, widget: string, required: false, hint: "Resume heading (both modes)." }
          - { label: Name, name: name, widget: string, required: false, hint: "Built-in resume only." }
          - { label: Tagline, name: tagline, widget: string, required: false, hint: "Built-in resume only." }
          - { label: Contact Button Label, name: contactTitle, widget: string, required: false, hint: "Built-in resume only." }
          - { label: Contact Note, name: contactNote, widget: string, required: false, hint: "Built-in resume only." }
          - { label: Contact URL, name: contactUrl, widget: string, required: false, hint: "Built-in resume only. A page path or full https:// URL." }
          - label: Main Column
            name: main
            widget: object
            collapsed: true
            hint: "Built-in resume only. The wide left column."
            fields:
              - &resumeSections
                label: Sections
                name: sections
                label_singular: Section
                widget: list
                collapsed: true
                hint: "Add, reorder (drag), or remove sections. Each section picks a layout. Sections with no items are hidden."
                typeKey: type
                types:
                  - label: Credits
                    name: credits
                    summary: "{{fields.heading}} (credits)"
                    widget: object
                    fields:
                      - { label: Heading, name: heading, widget: string, hint: "e.g. Stage, Film, Voiceover, Directing." }
                      - label: Credits
                        name: items
                        label_singular: Credit
                        widget: list
                        collapsed: true
                        summary: "{{fields.role}} — {{fields.showTitle}} ({{fields.details}})"
                        fields:
                          - { label: Role, name: role, widget: string, required: false }
                          - { label: Show / Project Title, name: showTitle, widget: string, required: false, hint: "Shown in quotes." }
                          - { label: Director, name: director, widget: string, required: false, hint: "Shown as 'Dir: …'." }
                          - { label: Details, name: details, widget: string, required: false, hint: "Company / venue and year, e.g. 'Shotgun Players, 2023'." }
                  - label: Dated List
                    name: dated
                    summary: "{{fields.heading}} (dated list)"
                    widget: object
                    fields:
                      - { label: Heading, name: heading, widget: string, hint: "e.g. Recognition, Education & Training." }
                      - label: Items
                        name: items
                        label_singular: Item
                        widget: list
                        collapsed: true
                        summary: "{{fields.date}} — {{fields.text}}"
                        fields:
                          - { label: Date, name: date, widget: string, required: false }
                          - { label: Text, name: text, widget: string, required: false }
                  - label: Works
                    name: works
                    summary: "{{fields.heading}} (works)"
                    widget: object
                    fields:
                      - { label: Heading, name: heading, widget: string, hint: "e.g. Emcee & Original Works." }
                      - label: Items
                        name: items
                        label_singular: Work
                        widget: list
                        collapsed: true
                        summary: "{{fields.date}} — {{fields.role}}"
                        fields:
                          - { label: Date, name: date, widget: string, required: false }
                          - { label: Title / Role, name: role, widget: string, required: false }
                          - { label: Highlight, name: highlight, widget: string, required: false, hint: "Shown emphasized, e.g. 'Raised $10,000 for …'." }
                          - { label: Details, name: details, widget: string, required: false }
                  - label: Simple List
                    name: simple
                    summary: "{{fields.heading}} (list)"
                    widget: object
                    fields:
                      - { label: Heading, name: heading, widget: string, hint: "e.g. Special Skills, Languages." }
                      - label: Items
                        name: items
                        label_singular: Item
                        widget: list
                        field: { label: Item, name: item, widget: string }
          - label: Side Column
            name: side
            widget: object
            collapsed: true
            hint: "Built-in resume only. The narrow right column."
            fields:
              - *resumeSections
  - name: footer
    label: Footer
    files:
      - label: Footer
        name: footer
        file: src/_data/footer.json
        fields:
          - label: Connect Methods
            name: connect
            widget: list
            summary: "{{fields.type}}"
            fields:
              - label: Type
                name: type
                widget: select
                options:
                  - { label: Booking Inquiries, value: booking }
                  - { label: Email, value: email }
                  - { label: Instagram, value: instagram }
                  - { label: LinkedIn, value: linkedin }
                  - { label: YouTube, value: youtube }
                  - { label: X, value: x }
                hint: "Determines the default label and icon."
              - label: Link
                name: link
                widget: string
                hint: "Use a page path, a mailto: link, or a full https:// URL."
              - label: SVG Override
                name: svg
                widget: image
                required: false
                hint: "Optional SVG upload. Leave empty to use the built-in icon for the selected type."
              - label: Order
                name: order
                widget: number
                value_type: int
                required: false
                min: 1
                hint: "Lower numbers appear first."
