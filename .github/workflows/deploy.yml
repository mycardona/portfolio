name: Deploy Eleventy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Decap CMS commits full-resolution photos straight to main. Shrink them
      # here so the site is built from the compressed files. Pushes made with
      # GITHUB_TOKEN do not trigger new workflow runs, so there is no deploy
      # loop; "[skip ci]" is belt and braces. The script is idempotent, so a
      # second run on already-compressed files changes nothing.
      - name: Compress uploads
        run: |
          npm run compress:uploads
          if [[ -n "$(git status --porcelain -- src/uploads)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git add -A src/uploads
            git commit -m "chore(uploads): compress images [skip ci]"
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed compressed uploads."
            else
              echo "::warning::Could not push compressed uploads; deploying anyway."
              git rebase --abort 2>/dev/null || true
            fi
          fi

      - name: Set site path prefix
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "SITE_PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "SITE_PATH_PREFIX=/$REPO_NAME/" >> "$GITHUB_ENV"
          fi

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
